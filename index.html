<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Non-Metal Element Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">

  <!-- PyScript: runs the Python code below directly in the browser -->
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    :root{
      --pink:#ecd6e0; --pink-dark:#d9bccb; --cream:#f4f4ec; --paper:#fdfcf3;
      --ink:#2b2b2b; --stripe-a:#fff7f3; --stripe-b:#b9babf; --stripe-c:#f3dfe6;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      min-height:100vh; color:var(--ink); font-family:'Patrick Hand',cursive; font-size:20px;
      background:
        radial-gradient(circle,#b9bbb0 5px,transparent 6px) 0 0/90px 90px,
        var(--cream);
      position:relative; overflow-x:hidden;
    }

    /* ---------- envelope background ---------- */
    .envelope{position:absolute;inset:0;background:var(--pink);
      clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%);z-index:0}
    .flap{position:absolute;left:0;right:0;top:0;height:640px;z-index:1;
      clip-path:polygon(7% 24%,50% 3%,93% 24%,100% 52%,100% 100%,0 100%,0 52%);
      background:repeating-linear-gradient(90deg,
        var(--stripe-a) 0 22px,var(--stripe-b) 22px 28px,var(--stripe-c) 28px 52px,
        var(--stripe-a) 52px 70px,var(--stripe-b) 70px 74px,var(--stripe-c) 74px 100px);
      opacity:.95}
    .flap::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;
      background:linear-gradient(transparent,var(--pink))}
    .pocket{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;
      background:var(--pink);border-top:2px solid var(--pink-dark);
      border-radius:60% 60% 0 0/40px 40px 0 0}

    /* ---------- page ---------- */
    main{position:relative;z-index:3;max-width:760px;margin:0 auto;padding:46px 18px 130px;text-align:center}
    h1{
      font-family:'Gochi Hand',cursive;font-weight:400;margin:0 0 -26px;line-height:.9;
      font-size:92px;letter-spacing:.03em;color:#fffdf5;
      -webkit-text-stroke:2.5px #2b2b2b;paint-order:stroke fill;
      text-shadow:3px 3px 0 rgba(43,43,43,.15);transform:rotate(-3deg);position:relative;z-index:4
    }
    h1 span{display:block;transform:translateX(34px) rotate(2deg)}

    .note-card{
      position:relative;background:var(--paper);border-radius:6px 6px 22px 22px;
      padding:54px 40px 54px;margin-top:0;transform:rotate(-.6deg);
      box-shadow:0 10px 26px rgba(120,80,100,.18);
    }
    .lines{
      background:repeating-linear-gradient(transparent 0 38px,#f1dcdf 38px 40px);
      padding:0 4px;line-height:40px;font-size:21px;letter-spacing:.04em;margin-bottom:26px
    }

    .search{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0 6px}
    .search input{
      font:inherit;font-size:22px;letter-spacing:.06em;text-align:center;width:250px;
      padding:10px 16px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)
    }
    .search input:focus{outline:4px solid #ecd6e0}
    .search button{
      font:inherit;font-size:22px;padding:10px 30px;border:2px solid var(--ink);border-radius:14px;
      background:#ecd6e0;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.12s
    }
    .search button:hover{background:#e3c3d3}
    .search button:active{transform:translate(3px,3px);box-shadow:none}
    #loading{font-size:15px;opacity:.55;margin-top:6px}

    .result{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px;text-align:left}
    .card{background:#fff;border:2px dashed #cdb3c0;border-radius:14px;padding:12px 18px}
    .card span{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
    .card strong{font-family:'Gochi Hand',cursive;font-weight:400;font-size:36px}
    .c1{background:#f6e6ee}.c3{background:#eeeee6}
    .note{display:inline-block;margin-top:28px;padding:14px 22px;border-radius:14px;background:#f6e6ee;border:2px dashed #c98aa6}
    .signoff{margin-top:36px;font-size:22px}

    /* decorations */
    .star{position:absolute;width:42px;height:42px;background:#c9c9d8;opacity:.9;
      clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
    .st1{left:6%;top:10px;transform:rotate(-12deg);width:34px;height:34px}
    .st2{right:8%;bottom:90px;transform:rotate(14deg)}
    .st3{left:7%;bottom:34px;transform:rotate(-8deg);width:34px;height:34px}
    .pin{position:absolute;right:-28px;top:-26px;width:150px;height:130px;z-index:5}
    .credit{margin-top:22px;font-size:16px;opacity:.7;position:relative;z-index:3}
    #list{font-size:16px;opacity:.75;margin-top:22px;line-height:1.4}

    @media(max-width:620px){
      h1{font-size:60px;margin-bottom:-14px}
      .note-card{padding:40px 20px}.result{grid-template-columns:1fr}
      .pin{width:110px;right:-12px}
    }
  </style>
</head>
<body>
  <div class="envelope"></div>
  <div class="flap"></div>
  <div class="pocket"></div>

  <main>
    <h1>Non-Metal<span>Finder</span></h1>

    <section class="note-card">
      <div class="star st1"></div>

      <div class="lines">Type the symbol of a non-metal element, like H, O or Cl, and press search.</div>

      <div class="search">
        <input type="text" id="symbol" placeholder="Enter symbol (e.g. C)" maxlength="3" autocomplete="off" py-keydown="on_key">
        <button type="button" id="searchBtn" py-click="search">Search</button>
      </div>
      <div id="loading">Loading Python&hellip; (a few seconds)</div>

      <div id="output"></div>
      <div class="star st2"></div>
      <div class="star st3"></div>
    </section>

    <p id="list">Elements in the list: H, He, C, N, O, F, Ne, P, S, Cl, Ar, Se, Br, Kr, I, Xe, Rn</p>
  </main>

  <script type="py">
from pyscript import document

# Python dictionary: symbol -> name, atomic number, atomic mass
NON_METALS = {
    "H":  {"name": "Hydrogen",   "number": 1,  "mass": 1.008},
    "He": {"name": "Helium",     "number": 2,  "mass": 4.0026},
    "C":  {"name": "Carbon",     "number": 6,  "mass": 12.011},
    "N":  {"name": "Nitrogen",   "number": 7,  "mass": 14.007},
    "O":  {"name": "Oxygen",     "number": 8,  "mass": 15.999},
    "F":  {"name": "Fluorine",   "number": 9,  "mass": 18.998},
    "Ne": {"name": "Neon",       "number": 10, "mass": 20.180},
    "P":  {"name": "Phosphorus", "number": 15, "mass": 30.974},
    "S":  {"name": "Sulfur",     "number": 16, "mass": 32.06},
    "Cl": {"name": "Chlorine",   "number": 17, "mass": 35.45},
    "Ar": {"name": "Argon",      "number": 18, "mass": 39.948},
    "Se": {"name": "Selenium",   "number": 34, "mass": 78.971},
    "Br": {"name": "Bromine",    "number": 35, "mass": 79.904},
    "Kr": {"name": "Krypton",    "number": 36, "mass": 83.798},
    "I":  {"name": "Iodine",     "number": 53, "mass": 126.904},
    "Xe": {"name": "Xenon",      "number": 54, "mass": 131.293},
    "Rn": {"name": "Radon",      "number": 86, "mass": 222},
}


def escape(text):
    return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


def search(event=None):
    symbol = document.querySelector("#symbol").value.strip()
    out = document.querySelector("#output")

    if symbol == "":
        out.innerHTML = '<div class="note error">Please type a symbol first!</div>'
        return

    key = symbol.capitalize()      # "cl" -> "Cl"
    info = NON_METALS.get(key)

    if info is None:
        out.innerHTML = (
            '<div class="note error">&ldquo;' + escape(symbol) +
            '&rdquo; does not exist in the non-metals list.</div>'
        )
        return

    out.innerHTML = f"""
    <div class="result">
      <div class="card c1"><span>Element Symbol</span><strong>{key}</strong></div>
      <div class="card c2"><span>Element Name</span><strong>{info['name']}</strong></div>
      <div class="card c3"><span>Atomic Number</span><strong>{info['number']}</strong></div>
      <div class="card c4"><span>Atomic Mass</span><strong>{info['mass']}</strong></div>
    </div>"""


def on_key(event):
    if event.key == "Enter":
        search()


document.querySelector("#loading").style.display = "none"
  </script>
</body>
</html>
